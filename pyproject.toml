[project]
name = "aegis-classifier"
version = "1.0.0"
description = "Aegis LLM classifier - slow path for permission decisions"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0.0",
    "loguru>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
